name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Get Dependencies
        run: flutter pub get

      - name: Extract App Version & Prepare Tag
        id: prep
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUM=${{ github.run_number }}
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}-build.${BUILD_NUM}"
          fi
          
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUM }} --android-skip-build-dependency-validation

      - name: Prepare APK Release Assets
        run: |
          mkdir -p release_assets
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          
          # Copy with versioned name and generic name
          cp "$APK_SOURCE" "release_assets/kayuwangi-${{ env.TAG_NAME }}.apk"
          cp "$APK_SOURCE" "release_assets/kayuwangi-latest.apk"
          
          # Generate SHA256 checksum
          cd release_assets
          sha256sum *.apk > checksums.txt
          cd ..

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: kayuwangi-apk-${{ env.TAG_NAME }}
          path: release_assets/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Release ${{ env.TAG_NAME }}"
          body: |
            ## 🌿 Kayuwangi Plant Monitoring App - ${{ env.TAG_NAME }}
            
            Build otomatis dari commit: `${{ github.sha }}`
            
            ### 📦 Berkas Unduhan APK:
            - **[kayuwangi-${{ env.TAG_NAME }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/kayuwangi-${{ env.TAG_NAME }}.apk)** *(Versi spesifik build)*
            - **[kayuwangi-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/kayuwangi-latest.apk)**
            
            ### 📋 Rincian:
            - **Versi Aplikasi**: `${{ env.VERSION }}`
            - **Nomor Build**: `${{ env.BUILD_NUM }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Komit Terakhir**: ${{ github.event.head_commit.message }}
            - **PocketBase Server**: `https://base.loc-2.com` (Koleksi: `kayuwangi`)
            
            *Dibuat otomatis oleh GitHub Actions Workflow.*
          files: |
            release_assets/kayuwangi-${{ env.TAG_NAME }}.apk
            release_assets/kayuwangi-latest.apk
            release_assets/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
