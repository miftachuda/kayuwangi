name: kayuwangi
description: "Aplikasi Android Monitoring Tanaman Kayuwangi dengan Geotagging & Mini Map Photo Stamping terintegrasi PocketBase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  image: ^4.3.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
